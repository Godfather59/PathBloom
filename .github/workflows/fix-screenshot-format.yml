name: Format screenshot localization pattern

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/screenshot-arabic-dock
          persist-credentials: true

      - name: Apply exact Prettier fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/logic/DeepLocalization.js')
          text = path.read_text(encoding='utf-8')
          old = """  [
    /^(?:Age|العمر)\\s*[0-9٠-٩]+\\s*:\\s*(.+)$/i,
    match => translateDeepSimulationText(match[1], 'ar'),
  ],"""
          new = """  [/^(?:Age|العمر)\\s*[0-9٠-٩]+\\s*:\\s*(.+)$/i, match => translateDeepSimulationText(match[1], 'ar')],"""
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected age-prefix pattern not found')
          PY

      - name: Commit formatting fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'PathBloom Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/logic/DeepLocalization.js
          git commit -m 'Format screenshot localization pattern'
          git push origin HEAD:fix/screenshot-arabic-dock
