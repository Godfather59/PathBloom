name: Apply HUD menu safe row

on:
  push:
    branches: [fix/hud-icons-safe-actions]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-hud-menu-safe-row
  cancel-in-progress: false

jobs:
  patch:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/hud-icons-safe-actions
          persist-credentials: true

      - name: Apply safe menu shortcut
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          hud = Path('src/components/Hud.jsx')
          text = hud.read_text(encoding='utf-8')
          if 'hud-safe-action hud-menu-fallback is-menu' not in text:
              pattern = re.compile(
                  r'(\n\s*<button\n\s*type="button"\n\s*className="hud-safe-action is-history".*?</button>)(\n\s*</div>)',
                  re.S,
              )
              menu = '''
            <button
              type="button"
              className="hud-safe-action hud-menu-fallback is-menu"
              onClick={onOpenMenu}
              aria-label={t('hud.openMenu', 'Open Menu')}
            >
              <AppIcon name="menu" size={18} />
              <span>{t('hud.openMenu', 'Menu')}</span>
            </button>'''
              text, count = pattern.subn(lambda match: match.group(1) + menu + match.group(2), text, count=1)
              if count != 1:
                  raise SystemExit('History safe-action block not found')
              hud.write_text(text, encoding='utf-8')

          css = Path('src/components/HudSafeActions.css')
          text = css.read_text(encoding='utf-8')
          if 'grid-auto-columns: minmax(0, 1fr);' not in text:
              old = '  grid-template-columns: repeat(2, minmax(0, 1fr));'
              if old not in text:
                  raise SystemExit('Safe-action grid declaration not found')
              text = text.replace(
                  old,
                  '  grid-auto-flow: column;\n  grid-auto-columns: minmax(0, 1fr);',
                  1,
              )
          if '.hud-safe-action.is-menu {' not in text:
              anchor = '.hud-safe-action-count {'
              menu_style = '''.hud-safe-action.is-menu {
            color: var(--pb-text-secondary);
            border-color: var(--pb-border);
            background: rgba(204, 226, 255, 0.045);
          }

          '''
              if anchor not in text:
                  raise SystemExit('Safe-action count style not found')
              text = text.replace(anchor, menu_style + anchor, 1)
          css.write_text(text, encoding='utf-8')

          android_test = Path('src/logic/__tests__/androidThemeRegression.test.jsx')
          text = android_test.read_text(encoding='utf-8')
          text = text.replace(
              "expect(css).toContain('grid-template-columns: repeat(2, minmax(0, 1fr))');",
              "expect(css).toContain('grid-auto-columns: minmax(0, 1fr)');",
          )
          android_test.write_text(text, encoding='utf-8')

          hud_test = Path('src/logic/__tests__/hudSafeActions.test.jsx')
          text = hud_test.read_text(encoding='utf-8')
          assertion = "    expect(hud).toContain('hud-safe-action hud-menu-fallback is-menu');\n"
          anchor = "    expect(hud).toContain('const openEventHistory = () =>');\n"
          if assertion not in text:
              if anchor not in text:
                  raise SystemExit('HUD test insertion point not found')
              text = text.replace(anchor, assertion + anchor, 1)
          hud_test.write_text(text, encoding='utf-8')
          PY

      - name: Format and validate
        run: |
          npm ci
          npx prettier --write src/components/Hud.jsx src/components/HudSafeActions.css src/logic/__tests__/androidThemeRegression.test.jsx src/logic/__tests__/hudSafeActions.test.jsx
          npm run lint
          npm test

      - name: Commit safe-row changes
        run: |
          git config user.name 'PathBloom Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/Hud.jsx src/components/HudSafeActions.css src/logic/__tests__/androidThemeRegression.test.jsx src/logic/__tests__/hudSafeActions.test.jsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Keep menu shortcut in safe HUD row'
          git push origin HEAD:fix/hud-icons-safe-actions
