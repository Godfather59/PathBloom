name: Repair deterministic world diplomacy

on:
  push:
    branches:
      - agent/world-simulation-2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/world-simulation-2
          fetch-depth: 0

      - name: Replace retry loop with deterministic distinct indexes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/logic/WorldSimulation2.js')
          source = path.read_text(encoding='utf-8')
          broken = """  const names = Object.keys(world.countries);\n  const leftName = pick(names);\n  let rightName = pick(names);\n  while (rightName === leftName) rightName = pick(names);\n  const left = world.countries[leftName];\n"""
          fixed = """  const names = Object.keys(world.countries);\n  if (names.length < 2) return;\n  const leftIndex = Math.floor(Math.random() * names.length);\n  const rightOffset = 1 + Math.floor(Math.random() * (names.length - 1));\n  const leftName = names[leftIndex];\n  const rightName = names[(leftIndex + rightOffset) % names.length];\n  const left = world.countries[leftName];\n"""
          if broken in source:
              path.write_text(source.replace(broken, fixed, 1), encoding='utf-8')
          PY

      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Source already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/logic/WorldSimulation2.js
          git commit -m 'Make world diplomacy deterministic-safe'
          git push origin HEAD:agent/world-simulation-2
