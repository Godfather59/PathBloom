name: Release polish and retention validation

on:
  pull_request:
    paths:
      - 'src/logic/SaveReliability.js'
      - 'src/logic/PlayerJourney.js'
      - 'src/logic/ReleasePolishRuntime.js'
      - 'src/logic/FeedbackPreferencesRuntime.js'
      - 'src/logic/BrowserRequireBridge.js'
      - 'src/logic/ToastLocalization.js'
      - 'src/logic/themes.js'
      - 'src/logic/ArabicSupplementalCatalog.js'
      - 'src/components/JourneyCard.jsx'
      - 'src/components/MilestoneCelebration.jsx'
      - 'src/components/OnboardingOverlay.jsx'
      - 'src/components/EventLog.jsx'
      - 'src/components/MainMenu.jsx'
      - 'src/components/NewLifeStart.css'
      - 'src/components/SystemMenu.jsx'
      - 'src/components/SaveSlotMenu.jsx'
      - 'src/components/Toast.jsx'
      - 'src/components/Toast.css'
      - 'src/components/ThemeCompatibility.css'
      - 'src/components/ScreenshotRegressionFixes.css'
      - 'src/components/ReleasePolish.css'
      - 'src/components/ReleasePerformance.css'
      - 'src/components/SaveRelease.css'
      - 'src/logic/__tests__/releasePolish.test.jsx'
      - 'src/logic/__tests__/androidThemeRegression.test.jsx'
      - 'scripts/check-release-readiness.mjs'
      - 'docs/BETA_RELEASE_CHECKLIST.md'
      - 'src/main.jsx'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'android/**'
      - '.github/workflows/release-polish.yml'
  workflow_dispatch:

jobs:
  validate-release-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate bilingual content
        run: npm run validate:content

      - name: Validate Arabic localization
        run: npm run validate:i18n

      - name: Validate Android release readiness
        run: npm run validate:release

      - name: Test save recovery and player retention
        shell: bash
        run: |
          set -o pipefail
          npm run test:release 2>&1 | tee release-test-output.txt

      - name: Upload failed release-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-output
          path: release-test-output.txt
          retention-days: 7

      - name: Test redesigned UI destinations
        run: npm run test:ui

      - name: Test content integration
        run: npm run test:content

      - name: Test world simulation
        run: npm run test:world

      - name: Build production app
        run: npm run build
