name: UI UX redesign validation

on:
  pull_request:
    paths:
      - 'src/components/AppIcon.jsx'
      - 'src/components/BottomNavigation.jsx'
      - 'src/components/Hud.jsx'
      - 'src/components/Hud.css'
      - 'src/components/ActionMenu.jsx'
      - 'src/components/EventLog.jsx'
      - 'src/components/EventLog.css'
      - 'src/components/DecisionModal.jsx'
      - 'src/components/ActivitiesMenu.jsx'
      - 'src/components/SystemMenu.jsx'
      - 'src/components/PrisonMenu.jsx'
      - 'src/components/SituationDetailsSheet.jsx'
      - 'src/components/DesignSystem.css'
      - 'src/components/ShellExtensions.css'
      - 'src/components/PrisonRedesign.css'
      - 'src/components/DecisionSheet.css'
      - 'src/components/DestinationScreens.css'
      - 'src/components/SystemMenuRedesign.css'
      - 'src/logic/__tests__/uiShell.test.jsx'
      - 'src/main.jsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-ux.yml'
  workflow_dispatch:

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate bilingual content
        run: npm run validate:content

      - name: Validate Arabic localization
        run: npm run validate:i18n

      - name: Run UI shell tests
        run: npm run test:ui

      - name: Run content integration tests
        run: npm run test:content

      - name: Build production app
        run: npm run build
