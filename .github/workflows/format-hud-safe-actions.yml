name: Format HUD safe actions

on:
  push:
    branches: [fix/hud-icons-safe-actions]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-hud-safe-actions
  cancel-in-progress: false

jobs:
  format:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/hud-icons-safe-actions
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Format changed sources
        run: |
          npm ci
          npx prettier --write src/components/Hud.jsx src/logic/__tests__/hudSafeActions.test.jsx

      - name: Commit formatting
        run: |
          git config user.name 'PathBloom Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/Hud.jsx src/logic/__tests__/hudSafeActions.test.jsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format HUD safe-action changes'
          git push origin HEAD:fix/hud-icons-safe-actions
