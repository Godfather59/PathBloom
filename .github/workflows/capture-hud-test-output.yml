name: Capture HUD test output

on:
  push:
    branches: [fix/hud-icons-safe-actions]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-hud-test-output
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/hud-icons-safe-actions
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Capture test output
        run: |
          npm ci
          set +e
          npm test > /tmp/pathbloom-tests.txt 2>&1
          status=$?
          set -e
          tail -n 240 /tmp/pathbloom-tests.txt > hud-test-output.txt
          echo "TEST_EXIT_CODE=$status" >> hud-test-output.txt

      - name: Commit diagnostics
        run: |
          git config user.name 'PathBloom Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add hud-test-output.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Capture HUD test diagnostics'
          git push origin HEAD:fix/hud-icons-safe-actions
