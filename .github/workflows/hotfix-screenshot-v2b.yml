name: Hotfix screenshot patcher v2b

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/screenshot-arabic-dock
          persist-credentials: true

      - name: Fix replacement callback
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/apply-screenshot-fixes-v2.yml')
          text = path.read_text(encoding='utf-8')
          if 'lambda _match: replacement' not in text:
              text, count = re.subn(
                  r'(\n\s*)replacement,(\n\s*event_text,)',
                  r'\1lambda _match: replacement,\2',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Could not locate v2 replacement call')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'PathBloom Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/apply-screenshot-fixes-v2.yml
          git commit -m 'Fix screenshot patcher replacement callback'
          git push origin HEAD:fix/screenshot-arabic-dock
