name: Arabic localization validation

on:
  pull_request:
    paths:
      - 'src/logic/ArabicLocalization*.js'
      - 'src/logic/localizationSanitizer.js'
      - 'src/logic/i18n.js'
      - 'src/logic/DeepLocalization.js'
      - 'src/components/ArabicLocalizationDashboard.jsx'
      - 'src/components/ArabicRTL.css'
      - 'src/components/DecisionModal.jsx'
      - 'src/components/EventLog.jsx'
      - 'src/components/SystemMenu.jsx'
      - 'src/content/packs/*.json'
      - 'src/main.jsx'
      - 'scripts/audit-arabic-localization.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/arabic-localization.yml'
  workflow_dispatch:

jobs:
  validate-arabic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate bilingual content packs
        run: npm run validate:content

      - name: Run strict Arabic localization audit
        id: arabic_audit
        shell: bash
        run: |
          set +e
          npm run validate:i18n 2>&1 | tee arabic-audit-output.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Arabic audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-localization-audit
          path: arabic-audit-output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Stop after failed Arabic audit
        if: steps.arabic_audit.outputs.exit_code != '0'
        run: exit 1

      - name: Run Arabic localization tests
        run: npm run test:i18n

      - name: Run content tests
        run: npm run test:content

      - name: Build production app
        run: npm run build
