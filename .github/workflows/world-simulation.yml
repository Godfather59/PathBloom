name: World simulation validation

on:
  pull_request:
    paths:
      - 'src/logic/WorldSimulation2*.js'
      - 'src/components/WorldSimulation2Dashboard.jsx'
      - 'src/content/packs/world-geopolitics.json'
      - 'src/logic/__tests__/worldSimulation2.test.js'
      - 'scripts/run-world-simulation-checks.mjs'
      - 'src/main.jsx'
      - 'src/components/SystemMenu.jsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/world-simulation.yml'
  workflow_dispatch:

jobs:
  validate-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate bilingual content packs
        run: npm run validate:content

      - name: Check World Simulation source syntax
        id: syntax_check
        continue-on-error: true
        shell: bash
        run: node --check src/logic/WorldSimulation2.js > world-syntax-report.txt 2>&1

      - name: Upload syntax report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-syntax-report
          path: world-syntax-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after syntax failure
        if: steps.syntax_check.outcome == 'failure'
        run: exit 1

      - name: Run World Simulation 2 tests
        id: world_tests
        continue-on-error: true
        run: npm run test:world -- --reporter=json --outputFile=world-test-results.json

      - name: Upload world test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-test-results
          path: world-test-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after failed world tests
        if: steps.world_tests.outcome == 'failure'
        run: exit 1

      - name: Run multi-world stress check
        run: node scripts/run-world-simulation-checks.mjs --worlds=20 --months=240

      - name: Build production app
        run: npm run build
